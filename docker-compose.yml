services:
  api:
    build: ./apps/api
    ports: ["8000:8000"]
    environment:
      VISION_API_URL: "${VISION_API_URL:-https://api.groq.com/openai/v1/chat/completions}"
      VISION_MODEL: "${VISION_MODEL:-}"
      VISION_API_KEY: "${VISION_API_KEY:-}"
      VISION_DISABLE_THINKING: "${VISION_DISABLE_THINKING:-false}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_VISION_MODEL: "${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082}"
      VISIONMATE_MEMORY_DB: "/data/visionmate_memory.sqlite3"
      CAMPUS_MEMORY_DB: "/data/campus_memory.sqlite3"
      SHARED_SIGHT_TOKEN: "${SHARED_SIGHT_TOKEN:-}"
      SHARED_SIGHT_DEVICE_IDS: "${SHARED_SIGHT_DEVICE_IDS:-}"
      CAMPUS_ALERT_TTL_HOURS: "${CAMPUS_ALERT_TTL_HOURS:-12}"
      OBSERVATION_MIN_CONFIDENCE: "${OBSERVATION_MIN_CONFIDENCE:-0.65}"
      # Opt in to official Ultralytics YOLO scene detections. The checkpoint is
      # downloaded by the container on first use; see README for AGPL licensing.
      ULTRALYTICS_YOLO_ENABLED: "${ULTRALYTICS_YOLO_ENABLED:-false}"
      ULTRALYTICS_YOLO_MODEL: "${ULTRALYTICS_YOLO_MODEL:-yolo11n.pt}"
      ULTRALYTICS_YOLO_DEVICE: "${ULTRALYTICS_YOLO_DEVICE:-cpu}"
      # BoT-SORT with sparse optical-flow CMC keeps IDs more stable when the
      # glasses camera moves. This is not metric camera-pose estimation.
      YOLO_TRACKER_CONFIG: "${YOLO_TRACKER_CONFIG:-/app/botsort.yaml}"
      DEPTH_ANYTHING_ENABLED: "${DEPTH_ANYTHING_ENABLED:-false}"
      DEPTH_ANYTHING_MODE: "${DEPTH_ANYTHING_MODE:-metric}"
      DEPTH_ANYTHING_DEVICE: "${DEPTH_ANYTHING_DEVICE:-cuda}"
      DEPTH_ANYTHING_CHECKPOINT: "${DEPTH_ANYTHING_CHECKPOINT:-/models/depth_anything_v2_metric_hypersim_vits.pth}"
      # Keep real-world collision warnings disabled until ground-truth and
      # accessibility safety validation are complete.
      MOBILITY_COLLISION_WARNINGS_ENABLED: "${MOBILITY_COLLISION_WARNINGS_ENABLED:-false}"
    volumes:
      # Persist the downloaded checkpoint between container rebuilds without
      # checking model weights into source control.
      - ultralytics-model-cache:/root/.cache/ultralytics
      - ./apps/api/models:/models:ro
      - ./apps/api/data:/data
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  ultralytics-model-cache:
